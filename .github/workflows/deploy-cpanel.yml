name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

env:
  APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Create deploy archive
        working-directory: backend
        run: |
          mkdir -p deploy-pkg
          cp -r dist package.json package-lock.json deploy.js deploy-pkg/
          tar czf ../deploy.tar.gz -C deploy-pkg .
          rm -rf deploy-pkg

      - name: Upload archive to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          source: deploy.tar.gz
          target: ${{ env.APP_ROOT }}
          strip_components: 0

      - name: Extract, install & restart via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            cd ${{ env.APP_ROOT }}
            tar xzf deploy.tar.gz
            rm deploy.tar.gz
            npm install --production
            npm run build
            echo "Deployment complete at $(date)"
