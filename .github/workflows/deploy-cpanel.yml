name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Local Dependencies
        run: npm ci
        working-directory: backend

      - name: Build Backend Codebase
        run: npm run build
        working-directory: backend

      - name: Prepare Clean Production Package
        working-directory: backend
        run: |
          mkdir -p deploy-pkg
          mkdir -p deploy-pkg/dist
          
          if [ -d "dist" ]; then cp -r dist/* deploy-pkg/dist/; fi
          cp package.json deploy-pkg/
          cp package-lock.json deploy-pkg/
          cp deploy.js deploy-pkg/
          
          if [ -d "prisma" ]; then cp -r prisma deploy-pkg/; fi
          if [ -d "src/database" ]; then mkdir -p deploy-pkg/src && cp -r src/database deploy-pkg/src/; fi

      - name: Upload Build to cPanel via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          source: backend/deploy-pkg/*
          target: /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi/backend/
          strip_components: 2

      - name: Install dependencies & restart on cPanel
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            rm -f ~/.cpanel/datastore/NodeApps/*.lock
            cd ~/repositories/whaatachi/backend
            npm install --production
            /scripts/restartsrv_nodeapps