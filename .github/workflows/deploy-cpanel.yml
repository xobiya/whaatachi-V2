name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

env:
  APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install local dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend codebase
        run: npm run build
        working-directory: backend

      - name: Create deploy archive
        working-directory: backend
        run: |
          mkdir -p deploy-pkg
          
          # 1. Explicitly structure and copy build directory assets
          mkdir -p deploy-pkg/dist
          cp -r dist/* deploy-pkg/dist/
          
          # 2. Copy configurations, entry scripts, and manifest logs
          cp package.json deploy-pkg/
          cp package-lock.json deploy-pkg/
          cp deploy.js deploy-pkg/
          
          # 3. UNCOMMENT lines below if your seeds or Prisma files need explicit tracking:
          # cp -r prisma/ deploy-pkg/prisma/ 2>/dev/null || true
          # cp -r src/database/ deploy-pkg/src/database/ 2>/dev/null || true
          
          # 4. Package everything up cleanly
          tar czf ../deploy.tar.gz -C deploy-pkg .
          rm -rf deploy-pkg

      - name: Upload archive package to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          source: deploy.tar.gz
          target: ${{ env.APP_ROOT }}
          strip_components: 0

      - name: Clean, Extract & Restart via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            cd ${{ env.APP_ROOT }}
            
            # 1. Safely remove old deployment files while keeping the archive we uploaded
            find . -maxdepth 1 ! -name '.' ! -name 'deploy.tar.gz' -exec rm -rf {} +
            
            # 2. Unpack the fresh build bundle files
            tar xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # 3. Build Node dependencies specifically for production runtime environment
            npm install --production
            
            # 4. Trigger Phusion Passenger engine to hot-reload your app immediately
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "Deployment complete at $(date)"