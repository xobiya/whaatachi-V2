name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # CRITICAL FIX: This installs esbuild onto the GitHub runner environment
      - name: Install Local Dependencies
        run: npm ci

      # Now esbuild will be available, preventing the "command not found" error
      - name: Build Backend Codebase
        run: npm run build

      - name: Prepare Clean Production Package
        run: |
          mkdir -p deploy-pkg
          mkdir -p deploy-pkg/dist
          
          if [ -d "dist" ]; then cp -r dist/* deploy-pkg/dist/; fi
          cp package.json deploy-pkg/
          cp package-lock.json deploy-pkg/
          cp deploy.js deploy-pkg/
          
          if [ -d "prisma" ]; then cp -r prisma deploy-pkg/; fi
          if [ -d "src/database" ]; then mkdir -p deploy-pkg/src && cp -r src/database deploy-pkg/src/; fi

      - name: Sync Production Build via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: 22
          protocol: sftp
          local-dir: ./deploy-pkg/
          server-dir: ./repositories/whaatachi/
          dangerous-clean-slate: true