name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

env:
  APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Sync files to cPanel via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='node_modules' --exclude='.env' --exclude='.env.*' --exclude='server.log' --exclude='cpanel-error.log'
          path: backend/
          remote_path: ${{ env.APP_ROOT }}
          remote_host: ${{ secrets.CPANEL_SSH_HOST }}
          remote_user: ${{ secrets.CPANEL_SSH_USER }}
          remote_key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Install deps & restart app via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            cd ${{ env.APP_ROOT }}
            npm install --production
            npm run build
            echo "Deployment complete at $(date)"
