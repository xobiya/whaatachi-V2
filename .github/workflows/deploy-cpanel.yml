name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Local Dependencies
        run: npm ci
        working-directory: backend

      - name: Build Backend Codebase
        run: npm run build
        working-directory: backend

      - name: Package Deployment Tarball
        run: |
          cd backend
          tar -czf ../deploy.tar.gz \
            dist/ \
            package.json \
            package-lock.json \
            deploy.js

      - name: Ensure target directory exists on cPanel
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            mkdir -p /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi

      - name: Upload Tarball to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: deploy.tar.gz
          target: /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi/

      - name: Verify upload and extract on cPanel
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            echo "=== Directory contents before extract ==="
            ls -la /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi/
            echo "=== Checking for tarball ==="
            test -f /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi/deploy.tar.gz && echo "tarball FOUND" || echo "tarball MISSING"
            cd /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi
            rm -rf dist package.json package-lock.json deploy.js
            tar -xzf deploy.tar.gz && echo "extract OK" || echo "extract FAILED"
            rm -f deploy.tar.gz
            echo "=== Directory contents after extract ==="
            ls -la /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi/
            echo "=== Installing dependencies ==="
            npm install --production && echo "npm install OK" || echo "npm install FAILED"
            echo "=== Restarting Node.js app ==="
            # Stop Node.js app(s) first to release locks
            /scripts/restartsrv_nodeapps stop 2>/dev/null || true
            sleep 2
            # Remove all lock files to prevent "Can't acquire lock" errors
            rm -f ~/.cpanel/datastore/NodeApps/*.lock
            sleep 1
            # Kill any lingering node processes for this app
            pkill -f "node.*repositories/whaatachi" 2>/dev/null || true
            sleep 2
            # Restart the Node.js app service
            /scripts/restartsrv_nodeapps start && echo "restart OK" || /scripts/restartsrv_nodeapps && echo "restart OK" || echo "restart FAILED"
