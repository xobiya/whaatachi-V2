name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

env:
  APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Create deploy archive
        working-directory: backend
        run: |
          mkdir -p deploy-pkg
          # We only package the compiled code (dist) and required runtime scripts
          cp -r dist package.json package-lock.json deploy.js deploy-pkg/
          tar czf ../deploy.tar.gz -C deploy-pkg .
          rm -rf deploy-pkg

      - name: Upload archive to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          source: deploy.tar.gz
          target: ${{ env.APP_ROOT }}
          strip_components: 0

      - name: Clean, Extract & Restart via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            cd ${{ env.APP_ROOT }}
            
            # 1. Clear out old code files safely while keeping the archive we just uploaded
            find . -maxdepth 1 ! -name '.' ! -name 'deploy.tar.gz' -exec rm -rf {} +
            
            # 2. Unpack the fresh build artifacts
            tar xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # 3. Only install production dependencies (much lighter on cPanel resources)
            npm install --production
            
            # 4. Tell Phusion Passenger to automatically hot-reload your application
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "Deployment complete at $(date)"