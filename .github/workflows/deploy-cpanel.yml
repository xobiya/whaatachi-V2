name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Local Dependencies
        run: npm ci
        working-directory: backend

      - name: Build Backend Codebase
        run: npm run build
        working-directory: backend

      - name: Prepare Clean Production Package
        run: |
          mkdir -p deploy-pkg/dist
          if [ -d "backend/dist" ]; then cp -r backend/dist/* deploy-pkg/dist/; fi
          cp backend/package.json deploy-pkg/
          cp backend/package-lock.json deploy-pkg/
          cp backend/deploy.js deploy-pkg/
          if [ -d "backend/prisma" ]; then cp -r backend/prisma deploy-pkg/; fi
          if [ -d "backend/src" ]; then cp -r backend/src deploy-pkg/; fi

      - name: Upload Build to cPanel via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: deploy-pkg/
          target: /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi/
          strip_components: 1

      - name: Install dependencies & restart on cPanel
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            rm -f ~/.cpanel/datastore/NodeApps/*.lock
            cd /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi
            npm install --production
            /scripts/restartsrv_nodeapps