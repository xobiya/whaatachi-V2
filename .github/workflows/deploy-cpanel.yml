name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Local Dependencies
        run: npm ci
        working-directory: backend

      - name: Build Backend Codebase
        run: npm run build
        working-directory: backend

      - name: Package Deployment Tarball
        run: |
          cd backend
          tar -czf ../deploy.tar.gz \
            dist/ \
            package.json \
            package-lock.json \
            deploy.js

      - name: Upload Tarball to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: deploy.tar.gz
          target: /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi/

      - name: Extract & Restart on cPanel
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            rm -f ~/.cpanel/datastore/NodeApps/*.lock
            cd /home/${{ secrets.CPANEL_SSH_USER }}/repositories/whaatachi
            rm -rf dist package.json package-lock.json deploy.js
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            npm install --production
            /scripts/restartsrv_nodeapps
